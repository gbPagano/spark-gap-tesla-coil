[package]
name = "coil-winding-firmware"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "coil-winding-firmware"
test = false
bench = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
debug = true
opt-level = "z"

# Dependências de hardware somente no alvo Xtensa: a lógica pode ser testada
# no computador com `cargo +stable test --lib --target x86_64-unknown-linux-gnu`.
[target.'cfg(target_arch = "xtensa")'.dependencies]
embassy-executor = "0.10"
embassy-time = "0.5.1"
embassy-sync = "0.8"
nb = "1"
esp-hal = { version = "~1.1.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3", features = ["esp32s3", "embassy"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
