# Duas partes de Medhurst; metadados/digitalizações localizados no G3YNH.
# MOD.1 (22/10/2026): reconsulta dirigida das p. 35–37 da parte de fevereiro,
# por OCR da digitalização; resistência em RF, geometria e limites das fórmulas
# de Butterworth. Não é leitura integral nem conferência de todas as tabelas.
# Finalidade: distinguir resistência RF do fio reto/DC e perdas do enrolamento;
# não adotar os números de Butterworth reproduzidos como resultados de Medhurst.
# Pendência: faixa de validade para o secundário construído e perdas dielétricas.
# As duas partes não são estudos independentes.
medhurst1947a:
  type: Article
  author: "Medhurst, R. G."
  title: "H. F. resistance and self-capacitance of single-layer solenoids"
  date: 1947-02
  page-range: 35-43
  language: en
  parent:
    type: Periodical
    title: "Wireless Engineer"
    volume: 24
  url: { value: "https://g6yb.com/g3ynh/zdocs/refs/Medhurst/Med35-43.pdf", date: 2026-10-22 }

# MOD.1 (22/10/2026): leitura dirigida por OCR das p. 80–82, seção 9;
# p. 82 também conferida visualmente. Finalidade: capacitância das conexões,
# método com capacitâncias adicionais e equivalente de reatância das bobinas.
# Não é leitura integral; concordância de reatância não comprova representação
# energética exata do secundário distribuído (contraponto: mcguyer2014-drude).
# Pendência: não equiparar a autocapacitância empírica à capacitância modal
# referida ao terminal ou aplicar a correção de fios ao protótipo sem análise.
# MOD.2.1 (22/10/2026): p. 83–84, §§9.5–9.6 e Tabela V conferidas
# visualmente na digitalização. K = 0,77 / 0,81 / 0,92 para h/D = 4,5 / 5 / 6.
# Faixa experimental informada: D = 0,675–6,36 cm, N = 10–aprox. 636,
# h/D = 0,163–29,2. O protótipo nominal de 10 cm e 1.100 espiras excede
# D/N estudados; não importar a indicação de erro de 5% como incerteza do lote.
medhurst1947b:
  type: Article
  author: "Medhurst, R. G."
  title: "H. F. resistance and self-capacitance of single-layer solenoids"
  date: 1947-03
  page-range: 80-92
  language: en
  parent:
    type: Periodical
    title: "Wireless Engineer"
