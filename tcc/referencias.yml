# D01 — modelo concentrado/distribuído, projeto e caracterização; §§4–7.
# Licentiate Thesis é pós-graduação, não licenciatura docente brasileira.
# Introdução (12/10/2026): leitura dirigida do PDF original, §§1.3–1.5,
# 2.1, 6.1.1, 6.2 e 6.3.3–6.4; história, aplicações, modos e ajustes.
# Trechos conferidos não significam leitura uniforme de toda a tese.
# Revisão da introdução (19/10/2026): §1.5, p. 4, e referência [Tes91]
# conferidas; o registro de 1891 remete à patente US 454.622 de Tesla.
# §§2.1, p. 8–9, e 6.1.4, p. 59–60, consultados para o funcionamento,
# os circuitos ressonantes acoplados e as contribuições capacitivas.
# Comparação de fontes (18/10/2026): §§2.6 e 3.4, p. 16 e 20, consultados
# sobre repetição, energia por pulso e crescimento das descargas; não é
# comparação experimental entre NST e dois MOTs comerciais brasileiros.
# Capítulo 2 (19/10/2026): leitura dirigida por extração do PDF, §6.1.1,
# p. 48–51 (modos e batimentos), §6.2, p. 63–65 (Q, carregamento e k),
# §§6.3.3–6.4, p. 73–76 (ajustes e regime), §7.1, p. 77 (níveis de erro).
# Eq. (6-19), p. 51, conferida também na imagem: fórmulas de f± no texto
# resultam de T=1, sem perdas; não são fórmulas de picos amortecidos gerais.
# Revisão de citações do capítulo 2 (19/10/2026): a base de circuitos foi
# atribuída diretamente a Terman, já conferido. Denicolai permanece na
# discussão de parâmetros equivalentes do secundário, sem chamadas repetidas
# para álgebra elementar. A remoção das antigas seções 2.8–2.9 não apaga
# os registros históricos de leitura e não altera o cadastro das obras.
# Capítulo 3 (20/10/2026): reconsulta dirigida de §6.2.2, p. 64–65,
# no PDF original; indutância em série e curva k versus altura do primário.
# A medição nas duas polaridades é proposta do protocolo deste trabalho,
# derivada do modelo indutivo, não transcrição do procedimento de Denicolai.
# MOD.2.1 (22/10/2026): §§4.2–4.3, p. 25–26, eqs. 4-2 a 4-8,
# reconsultadas por extração do PDF; eqs. 4-7/4-8 também conferidas visualmente.
# Finalidade: reprodução de Wheeler e soma capacitiva aproximada; fórmula
# empírica do toroide creditada pelo autor a Bert Pool, não a Medhurst.
# Não fornece erro certificado para duto corrugado com forma central nem
# torna a soma uma capacitância efetiva modal. Não é nova leitura integral.
# MOD.2.2/2.3 (22/10/2026): reconsulta por extração do final de §2.4 e
# §2.5.1, p. 12–13, e §§4.4–4.5, p. 26–28. Finalidade: CC/carga ressonante,
# capacitor, espiral plana e conversão da adaptação de Wheeler; exemplo
